# fluxkit playground. See playground/README.md.
#
#   cd playground && docker compose up --build
#   → http://localhost:8095/fluxkit-preview
services:
  playground:
    build: .
    image: fluxkit-playground
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /fluxkit/playground
    volumes:
      - ..:/fluxkit
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      npm_config_cache: /tmp/npm
    ports:
      - "${FLUXKIT_PLAYGROUND_PORT:-8095}:8000"
      - "${FLUXKIT_VITE_PORT:-5173}:5173"
    command: ["sh", "/fluxkit/playground/start.sh"]
